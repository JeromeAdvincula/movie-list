
<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Movie List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- REFRESH -->
  <ion-refresher
    slot="fixed"
    (ionRefresh)="refreshMovies($event)">
    <ion-refresher-content>
    </ion-refresher-content>
  </ion-refresher>

  <!-- SEARCH -->
  <ion-searchbar
    placeholder="Search movies..."
    [(ngModel)]="searchTerm"
    animated="true">
  </ion-searchbar>

  <!-- FILTER -->
  <ion-segment [(ngModel)]="selectedStatus">

    <ion-segment-button value="All">
      <ion-label>ALL</ion-label>
    </ion-segment-button>

    <ion-segment-button value="Released">
      <ion-label>RELEASED</ion-label>
    </ion-segment-button>

    <ion-segment-button value="Upcoming">
      <ion-label>UPCOMING</ion-label>
    </ion-segment-button>

  </ion-segment>

  <!-- MOVIE LIST -->
  <ion-list *ngIf="filteredMovieList.length > 0">

    <ion-card *ngFor="let movie of filteredMovieList">

      <ion-card-header>

        <ion-card-title>
          {{ movie.title }}
        </ion-card-title>

        <ion-card-subtitle>
          {{ movie.genre }}
        </ion-card-subtitle>

      </ion-card-header>

      <ion-card-content>

        <p>
          <strong>Duration:</strong>
          {{ movie.duration }} minutes
        </p>

        <p>
          <strong>Status:</strong>
          {{ movie.status }}
        </p>

        <p>
          <strong>Rating:</strong>
          ⭐ {{ movie.rating }}/10
        </p>

        <ion-button
          color="primary"
          size="small"
          (click)="openUpdateModal(movie)">

          <ion-icon
            slot="start"
            name="create-outline">
          </ion-icon>

          Edit

        </ion-button>

        <ion-button
          color="danger"
          size="small"
          (click)="deleteMovie(movie.id)">

          <ion-icon
            slot="start"
            name="trash-outline">
          </ion-icon>

          Delete

        </ion-button>

      </ion-card-content>

    </ion-card>

  </ion-list>

  <!-- EMPTY LIST -->
  <div
    class="ion-text-center ion-padding"
    *ngIf="filteredMovieList.length === 0">

    <p>No movies found.</p>

  </div>

  <!-- UPDATE MODAL -->
  <ion-modal
    [isOpen]="updateModalOpen"
    (didDismiss)="updateModalOpen = false">

    <ng-template>

      <ion-header>

        <ion-toolbar color="dark">

          <ion-title>Edit Movie</ion-title>

          <ion-buttons slot="end">

            <ion-button
              (click)="updateModalOpen = false">
              Close
            </ion-button>

          </ion-buttons>

        </ion-toolbar>

      </ion-header>

      <ion-content class="ion-padding">

        <ion-list>

          <ion-item>
            <ion-input
              label="Movie Title"
              labelPlacement="stacked"
              [(ngModel)]="selectedMovie.title">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              label="Genre"
              labelPlacement="stacked"
              [(ngModel)]="selectedMovie.genre">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              label="Duration (Minutes)"
              labelPlacement="stacked"
              type="number"
              [(ngModel)]="selectedMovie.duration">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-select
              label="Status"
              labelPlacement="stacked"
              [(ngModel)]="selectedMovie.status">

              <ion-select-option value="Released">
                Released
              </ion-select-option>

              <ion-select-option value="Upcoming">
                Upcoming
              </ion-select-option>

            </ion-select>
          </ion-item>

          <ion-item>
            <ion-input
              label="Rating (1-10)"
              labelPlacement="stacked"
              type="number"
              min="1"
              max="10"
              [(ngModel)]="selectedMovie.rating">
            </ion-input>
          </ion-item>

        </ion-list>

        <ion-button
          expand="block"
          class="ion-margin-top"
          (click)="saveUpdate()">

          Save Changes

        </ion-button>

      </ion-content>

    </ng-template>

  </ion-modal>

  <!-- TOAST -->
  <ion-toast
    [isOpen]="toastOpen"
    [message]="toastMessage"
    [duration]="2000"
    position="bottom"
    (didDismiss)="closeToast()">
  </ion-toast>

</ion-content>
