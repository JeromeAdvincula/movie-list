<ion-header>
  <ion-toolbar>

    <ion-title>
      About
    </ion-title>

  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">

  <div class="about-container">

    <ion-icon
      name="play-circle-outline"
      class="movie-icon">
    </ion-icon>


    <h1>
      Movie Tracker
    </h1>


    <p>
      A simple Movie CRUD application
      built with Ionic, Angular, and
      Firebase Firestore.
    </p>


    <ion-list>

      <ion-item>

        <ion-icon
          name="add-circle-outline"
          slot="start">
        </ion-icon>

        <ion-label>
          Add Movie
        </ion-label>

      </ion-item>


      <ion-item>

        <ion-icon
          name="list-outline"
          slot="start">
        </ion-icon>

        <ion-label>
          View Movie List
        </ion-label>

      </ion-item>


      <ion-item>

        <ion-icon
          name="create-outline"
          slot="start">
        </ion-icon>

        <ion-label>
          Update Movie
        </ion-label>

      </ion-item>


      <ion-item>

        <ion-icon
          name="trash-outline"
          slot="start">
        </ion-icon>

        <ion-label>
          Delete Movie
        </ion-label>

      </ion-item>


      <ion-item>

        <ion-icon
          name="search-outline"
          slot="start">
        </ion-icon>

        <ion-label>
          Search and Filter movie
        </ion-label>

      </ion-item>

    </ion-list>

  </div>

</ion-content>
