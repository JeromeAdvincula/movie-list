
name: Movie List CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests if available
        run: npm test --if-present -- --watch=false

      - name: Build application
        run: npm run build

  continuous-deployment:
    needs: continuous-integration
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t movie-list:latest .

      - name: Remove previous container
        shell: powershell
        run: |
          docker rm -f movie-list-container
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous container to remove."
          }

      - name: Start updated container
        run: docker run -d --name movie-list-container --restart unless-stopped -p 8100:8100 movie-list:latest

      - name: Verify application
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs movie-list-container
            exit 1
          }
  